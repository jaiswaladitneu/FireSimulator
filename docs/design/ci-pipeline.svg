 UI'">python build.py setup --scope backend</text><text x="148.939" y="392.487" fill="#000" font-size="18.958" textLength="291.031" font-family="'Segoe UI'">(pip install -r requirements-dev.txt)</text><rect x="116.212" y="462.87" width="393.356" height="54.383" fill="#FFF7F0" style="stroke:#B45309;stroke-width:0.729;" rx="4.375" ry="4.375"/><text x="130.795" y="497.911" fill="#000" font-size="18.958" textLength="364.189" font-family="'Segoe UI'">python build.py lint --scope backend   (ruff)</text><rect x="55.417" y="568.294" width="514.946" height="54.383" fill="#FFF7F0" style="stroke:#B45309;stroke-width:0.729;" rx="4.375" ry="4.375"/><text x="70" y="603.336" fill="#000" font-size="18.958" textLength="485.78" font-family="'Segoe UI'">python build.py compile --scope backend   (byte-compile)</text><rect x="140.132" y="673.719" width="345.515" height="79.599" fill="#FFF7F0" style="stroke:#B45309;stroke-width:0.729;" rx="4.375" ry="4.375"/><text x="154.715" y="708.76" fill="#000" font-size="18.958" textLength="312.451" font-family="'Segoe UI'">python build.py test --scope backend</text><text x="154.715" y="733.976" fill="#000" font-size="18.958" textLength="316.349" font-family="'Segoe UI'">(pytest + pytest-cov, fails under 90 %)</text><rect x="124.608" y="804.359" width="376.563" height="54.383" fill="#FFF7F0" style="stroke:#B45309;stroke-width:0.729;" rx="4.375" ry="4.375"/><text x="139.191" y="839.4" fill="#000" font-size="18.958" textLength="347.397" font-family="'Segoe UI'">python build.py docs   (pdoc -> docs/api)</text><rect x="119.253" y="909.784" width="387.274" height="54.383" fill="#FFF7F0" style="stroke:#B45309;stroke-width:0.729;" rx="4.375" ry="4.375"/><text x="133.836" y="944.825" fill="#000" font-size="18.958" textLength="358.107" font-family="'Segoe UI'">Upload artifacts: coverage-report, api-docs</text><rect x="625.78" y="330.559" width="471.816" height="610.062" fill="none" style="stroke:#000;stroke-width:2.188;" rx="4.375" ry="4.375"/><path d="M961.