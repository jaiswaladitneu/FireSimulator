[project]
name = "firesim"
version = "0.1.0"
description = "Fire Simulator — the fire-modeling component of Fireforce6"
requires-python = ">=3.12"
dependencies = [
    "numpy>=2.0",
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "pydantic>=2.8",
    "nats-py>=2.7",
    "redis>=5.0",
    "psycopg[binary]>=3.1",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-cov>=7.0",
    "httpx>=0.27",
    "ruff>=0.6",
    "pdoc==16.0.0",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]

# Coverage is opt-in (python build.py test, or pytest --cov) so a single test file
# can still be run on its own without tripping the threshold.
[tool.coverage.run]
source = ["engine", "api", "messaging", "persistence"]
branch = true

[tool.coverage.report]
show_missing = true
skip_empty = true
fail_under = 90

[tool.coverage.html]
directory = "htmlcov"

[tool.coverage.xml]
output = "coverage.xml"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
