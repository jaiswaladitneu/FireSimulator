# Local deployment of the Fire Simulator (API + command-center UI) on http://localhost:8000.
# From the repository root:
#   python build.py deploy      (or: docker compose -f infra/docker-compose.yml up -d --build)
#   python build.py stop        (or: docker compose -f infra/docker-compose.yml down)
#
# NATS, PostgreSQL and Redis are the integration services. The app uses them when their
# environment variables are set (FIRESIM_NATS_URL, FIRESIM_DATABASE_URL, FIRESIM_REDIS_URL);
# otherwise it runs on the in-memory bus and JSON-file history. Start them with:
#   docker compose -f infra/docker-compose.yml --profile integration up -d
name: firesim

services:
  firesim:
    build:
      context: ..
      dockerfile: Dockerfile
    image: firesim:local
    ports:
      - "8000:8000"
    volumes:
      - incidents:/app/data        # incident history survives restarts and rebuilds
    restart: unless-stopped

  nats:
    image: nats:2.10
    profiles: [integration]
    ports:
      - "4222:4222"

  postgres:
    image: postgres:16
    profiles: [integration]
    environment:
      POSTGRES_USER: firesim
      POSTGRES_PASSWORD: firesim
      POSTGRES_DB: firesim
    ports:
      - "5432:5432"

  redis:
    image: redis:7
    profiles: [integration]
    ports:
      - "6379:6379"

volumes:
  incidents:
